<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.R.I.A. — Asistente Personal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');

  :root{
    --bg: #060a10;
    --panel: #0b121c;
    --cyan: #4fe3f2;
    --cyan-dim: #1f5d66;
    --amber: #ffb454;
    --text: #dceef4;
    --text-dim: #6f8fa0;
    --danger: #ff5f6d;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 15%, rgba(79,227,242,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 24px 16px 40px;
  }

  .eyebrow{
    font-family:'Share Tech Mono', monospace;
    letter-spacing: 4px;
    font-size: 11px;
    color: var(--cyan-dim);
    margin-top: 6px;
  }

  h1{
    font-weight:700;
    font-size: 26px;
    letter-spacing: 2px;
    margin: 4px 0 2px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(79,227,242,0.45);
  }

  .status-line{
    font-family:'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 22px;
    height: 16px;
  }

  .reactor-wrap{
    position:relative;
    width: 190px; height: 190px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border: 1.5px solid var(--cyan-dim);
  }
  .ring.r1{ width:190px; height:190px; }
  .ring.r2{ width:150px; height:150px; border-style:dashed; opacity:.6; }
  .ring.r3{ width:110px; height:110px; }
  .core{
    width: 78px; height:78px;
    border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #fff, var(--cyan) 40%, #0a3a40 100%);
    box-shadow: 0 0 30px rgba(79,227,242,0.55), 0 0 70px rgba(79,227,242,0.25);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .reactor-wrap.listening .core{ animation: pulse 1.1s ease-in-out infinite; }
  .reactor-wrap.listening .ring{ animation: spin 6s linear infinite; }
  .reactor-wrap.speaking .core{ animation: pulse 0.5s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 30px rgba(79,227,242,0.55),0 0 70px rgba(79,227,242,0.25);}
    50%{ transform:scale(1.12); box-shadow:0 0 45px rgba(79,227,242,0.85),0 0 100px rgba(79,227,242,0.4);}
  }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .mic-btn{
    position:absolute;
    bottom:-4px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    width: 44px; height:44px;
    border-radius:50%;
    font-size: 18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mic-btn:active{ transform: scale(0.94); }
  .mic-btn.on{ background: var(--cyan); color:#03181b; box-shadow:0 0 18px rgba(79,227,242,.6); }

  .panel{
    width: 100%; max-width: 480px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
    border: 1px solid rgba(79,227,242,0.15);
    border-radius: 10px;
    padding: 14px;
  }

  .log{
    height: 260px;
    overflow-y:auto;
    padding-right: 4px;
    margin-bottom: 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .log::-webkit-scrollbar{ width:4px; }
  .log::-webkit-scrollbar-thumb{ background: var(--cyan-dim); border-radius:2px; }

  .bubble{
    font-size: 14px;
    line-height:1.4;
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 90%;
  }
  .bubble.user{
    align-self:flex-end;
    background: rgba(79,227,242,0.12);
    border: 1px solid rgba(79,227,242,0.25);
  }
  .bubble.aria{
    align-self:flex-start;
    background: rgba(255,180,84,0.08);
    border: 1px solid rgba(255,180,84,0.2);
    color: var(--amber);
  }
  .bubble .tag{
    font-family:'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing:1px;
    display:block;
    opacity:.6;
    margin-bottom:2px;
  }

  input[type=text]{
    flex:1;
    background: #05090e;
    border: 1px solid rgba(79,227,242,0.2);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family:'Rajdhani',sans-serif;
    font-size: 15px;
    outline:none;
  }
  input[type=text]:focus{ border-color: var(--cyan); }
  button.send{
    background: var(--cyan);
    border:none;
    color:#03181b;
    font-weight:700;
    padding: 0 16px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Rajdhani',sans-serif;
  }

  .wake-btn{
    width:100%;
    margin-top:10px;
    background: #05090e;
    border: 1px solid rgba(255,180,84,0.25);
    color: var(--amber);
    padding: 9px 10px;
    border-radius:6px;
    font-family:'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: .5px;
    cursor:pointer;
  }
  .wake-btn.on{
    background: rgba(255,180,84,0.15);
    border-color: var(--amber);
    box-shadow: 0 0 14px rgba(255,180,84,0.35);
  }
  .wake-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .hint{
    font-family:'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-top:10px;
    line-height:1.7;
  }
  .hint b{ color: var(--cyan-dim); }
</style>
</head>
<body>

  <div class="eyebrow">SISTEMA DE ASISTENCIA PERSONAL</div>
  <h1>A.R.I.A.</h1>
  <div class="status-line" id="statusLine">en espera</div>

  <div class="reactor-wrap" id="reactorWrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core"></div>
    <button class="mic-btn" id="micBtn" title="Hablar">🎤</button>
  </div>

  <div class="panel">
    <div class="log" id="log"></div>
    <div id="form" style="display:flex; gap:8px;">
      <input type="text" id="input" placeholder="Escribe o di: 'recuerda que...'" autocomplete="off">
      <button class="send" type="button" id="sendBtn">Enviar</button>
    </div>
    <button class="wake-btn" id="wakeBtn" type="button">⚪ Modo "Aria" (siempre escuchando): apagado</button>
    <div class="hint">
      <b>recuerda [algo]</b> — guarda un dato · <b>qué recuerdas de [tema]</b> — busca · <b>lista todo</b> — muestra todo lo guardado · <b>olvida [tema]</b> — borra<br>
      Con el modo "Aria" activo, di: <b>"Aria, recuerda que..."</b> y responde por voz automáticamente, sin tocar nada.
    </div>
  </div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const micBtn = document.getElementById('micBtn');
const reactorWrap = document.getElementById('reactorWrap');
const statusLine = document.getElementById('statusLine');

function addBubble(text, who){
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = who === 'user' ? 'TÚ' : 'A.R.I.A.';
  b.appendChild(tag);
  const body = document.createElement('span');
  body.textContent = text;
  b.appendChild(body);
  log.appendChild(b);
  log.scrollTop = log.scrollHeight;
}

let chosenVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return;
  chosenVoice =
    voices.find(v => /es-(mx|us|419)/i.test(v.lang)) ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es')) ||
    null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  reactorWrap.classList.add('speaking');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-ES';
  if(chosenVoice) utter.voice = chosenVoice;
  utter.rate = 1.02;
  utter.pitch = 1.0;
  utter.onend = () => reactorWrap.classList.remove('speaking');
  speechSynthesis.speak(utter);
}

function say(text){
  addBubble(text, 'aria');
  speak(text);
}

const hasRealStorage = !!(window.storage && window.storage.set && window.storage.get);
const hasLocalStorage = (() => { try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
const memoryFallback = new Map();
const MEMORIES_KEY = 'aria_memorias';
let storageBroken = !hasRealStorage;
let warnedFallback = false;

function warnFallbackOnce(){
  if(warnedFallback) return;
  warnedFallback = true;
  const modo = hasLocalStorage ? 'localStorage del navegador (sí persiste)' : 'memoria temporal (no persiste)';
  console.warn('Almacenamiento de Claude no disponible: usando ' + modo + '.');
}

async function storageGet(key){
  if(!storageBroken){
    try{
      return await window.storage.get(key, false);
    }catch(e){
      if(e && /not found|does not exist|404/i.test(String(e.message || e))){
        throw e;
      }
      console.warn('storage.get falló, cambiando de respaldo:', e);
      storageBroken = true;
      warnFallbackOnce();
    }
  }
  if(hasLocalStorage){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { key, value: v };
  }
  if(!memoryFallback.has(key)) throw new Error('not found');
  return { key, value: memoryFallback.get(key) };
}

async function storageSet(key, value){
  if(!storageBroken){
    try{
      return await window.storage.set(key, value, false);
    }catch(e){
      console.warn('storage.set falló, cambiando de respaldo:', e);
      storageBroken = true;
      warnFallbackOnce();
    }
  }
  if(hasLocalStorage){
    localStorage.setItem(key, value);
    return { key, value };
  }
  memoryFallback.set(key, value);
  return { key, value };
}

if(storageBroken){ warnFallbackOnce(); }

async function readMemoriesRaw(){
  try{
    const r = await storageGet(MEMORIES_KEY);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(Array.isArray(parsed)) return parsed;
    }
    return [];
  }catch(e){
    return [];
  }
}

async function writeMemoriesRaw(list){
  await storageSet(MEMORIES_KEY, JSON.stringify(list));
  memoryFallback.set(MEMORIES_KEY, JSON.stringify(list));
}

async function saveMemory(topic, content){
  try{
    const list = await readMemoriesRaw();
    list.push({ topic, content, ts: Date.now() });
    await writeMemoriesRaw(list);
    return { success: true };
  }catch(e){
    console.error('Error al guardar (incluso en memoria temporal):', e);
    return { success: false, error: (e && e.message) ? e.message : String(e) };
  }
}

async function getAllMemories(){
  const list = await readMemoriesRaw();
  return list.slice().sort((a,b) => a.ts - b.ts);
}

async function deleteMemoriesMatching(term){
  try{
    const list = await readMemoriesRaw();
    const remaining = list.filter(mem =>
      !(mem.topic.toLowerCase().includes(term) || mem.content.toLowerCase().includes(term))
    );
    const removed = list.length - remaining.length;
    if(removed > 0) await writeMemoriesRaw(remaining);
    return removed;
  }catch(e){
    console.error('Error al borrar', e);
    return 0;
  }
}

async function handleCommand(raw){
  const text = raw.trim();
  const lower = text.toLowerCase();

  let m = lower.match(/^recuerda(?:\s+que)?\s+(.+)/);
  if(m){
    const content = text.slice(text.toLowerCase().indexOf(m[1])).trim();
    const topic = content.split(' ').slice(0,4).join(' ');
    const result = await saveMemory(topic, content);
    say(result.success ? `Anotado: "${content}".` : `No pude guardar eso. Detalle técnico: ${result.error}`);
    return;
  }

  m = lower.match(/^olvida\s+(.+)/);
  if(m){
    const count = await deleteMemoriesMatching(m[1].trim());
    say(count > 0 ? `Eliminé ${count} recuerdo(s) sobre "${m[1].trim()}".` : `No encontré nada sobre "${m[1].trim()}".`);
    return;
  }

  if(/^(lista todo|muéstrame todo|muestrame todo|qué sabes|que sabes)/.test(lower)){
    const all = await getAllMemories();
    if(all.length === 0){ say('Todavía no tengo nada guardado.'); return; }
    const resumen = all.map(m => '• ' + m.content).join('\n');
    addBubble(resumen, 'aria');
    speak(`Tengo ${all.length} recuerdos guardados.`);
    return;
  }

  m = lower.match(/^(?:qué recuerdas de|que recuerdas de|recuerdas)\s+(.+)/);
  if(m){
    const term = m[1].replace(/\?/g,'').trim();
    const all = await getAllMemories();
    const matches = all.filter(mem => mem.topic.toLowerCase().includes(term) || mem.content.toLowerCase().includes(term));
    if(matches.length === 0){ say(`No tengo nada guardado sobre "${term}".`); return; }
    matches.forEach(mm => addBubble(mm.content, 'aria'));
    speak(matches.length === 1 ? matches[0].content : `Encontré ${matches.length} recuerdos sobre eso.`);
    return;
  }

  say('Puedes decirme "recuerda que...", preguntarme "qué recuerdas de..." o pedir "lista todo".');
}

async function submitMessage(){
  const val = input.value.trim();
  if(!val) return;
  addBubble(val, 'user');
  input.value = '';
  statusLine.textContent = 'procesando...';
  try{
    await handleCommand(val);
  }catch(err){
    console.error('Error procesando comando', err);
    say('Tuve un problema procesando eso. Revisa la consola para más detalles.');
  }
  statusLine.textContent = 'en espera';
}

const sendBtn = document.getElementById('sendBtn');
sendBtn.addEventListener('click', submitMessage);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    submitMessage();
  }
});

let recognition = null;
let listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SR){
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('on');
    reactorWrap.classList.add('listening');
    statusLine.textContent = 'escuchando...';
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('on');
    reactorWrap.classList.remove('listening');
    statusLine.textContent = 'en espera';
  };
  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    addBubble(transcript, 'user');
    statusLine.textContent = 'procesando...';
    await handleCommand(transcript);
    statusLine.textContent = 'en espera';
  };
  recognition.onerror = (event) => {
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      statusLine.textContent = 'permiso de micrófono bloqueado';
      say('No tengo permiso para usar el micrófono aquí. Revisa los permisos del navegador, o usa el campo de texto.');
    } else if(event.error === 'no-speech'){
      statusLine.textContent = 'no escuché nada, intenta de nuevo';
    } else {
      statusLine.textContent = 'error de voz: ' + event.error;
    }
  };

  micBtn.addEventListener('click', () => {
    if(listening){ recognition.stop(); }
    else{ recognition.start(); }
  });
} else {
  micBtn.style.opacity = 0.35;
  micBtn.title = 'Voz no disponible en este navegador';
  micBtn.addEventListener('click', () => {
    statusLine.textContent = 'reconocimiento de voz no disponible aquí';
  });
}

const wakeBtn = document.getElementById('wakeBtn');
let wakeMode = false;
let wakeRecognition = null;

function updateWakeUI(){
  wakeBtn.classList.toggle('on', wakeMode);
  wakeBtn.textContent = wakeMode
    ? '🟢 Modo "Aria" (siempre escuchando): encendido'
    : '⚪ Modo "Aria" (siempre escuchando): apagado';
  if(wakeMode){
    reactorWrap.classList.add('listening');
    statusLine.textContent = 'esperando... di "Aria"';
  } else if(!listening){
    reactorWrap.classList.remove('listening');
    statusLine.textContent = 'en espera';
  }
  micBtn.disabled = wakeMode;
}

function buildWakeRecognition(){
  const rec = new SR();
  rec.lang = 'es-ES';
  rec.continuous = true;
  rec.interimResults = false;

  rec.onresult = async (event) => {
    for(let i = event.resultIndex; i < event.results.length; i++){
      const res = event.results[i];
      if(!res.isFinal) continue;
      const transcript = res[0].transcript.trim();
      const lower = transcript.toLowerCase();
      const wake = lower.match(/\baria\b[,:]?\s*(.*)/);
      if(!wake) continue;

      const command = wake[1].trim();
      addBubble(transcript, 'user');
      statusLine.textContent = 'procesando...';
      if(command){
        await handleCommand(command);
      } else {
        say('Dime.');
      }
      statusLine.textContent = wakeMode ? 'esperando... di "Aria"' : 'en espera';
    }
  };

  rec.onerror = (event) => {
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      wakeMode = false;
      updateWakeUI();
      say('No tengo permiso de micrófono para el modo siempre escuchando. Revísalo en los ajustes del navegador.');
    }
  };

  rec.onend = () => {
    if(wakeMode){
      try{ rec.start(); }catch(e){}
    }
  };

  return rec;
}

if(SR){
  wakeBtn.addEventListener('click', () => {
    wakeMode = !wakeMode;
    if(wakeMode){
      if(listening) recognition.stop();
      if(!wakeRecognition) wakeRecognition = buildWakeRecognition();
      try{ wakeRecognition.start(); }catch(e){}
      say('Modo Aria activado. Di "Aria" seguido de lo que necesites, por ejemplo: "Aria, recuerda que..."');
    } else {
      if(wakeRecognition){ try{ wakeRecognition.stop(); }catch(e){} }
      say('Modo Aria desactivado.');
    }
    updateWakeUI();
  });
} else {
  wakeBtn.disabled = true;
  wakeBtn.textContent = '⚪ Modo "Aria": voz no disponible en este navegador';
}

(async () => {
  const all = await getAllMemories();
  const diag = ` [diagnóstico: storage-claude=${hasRealStorage}, localStorage=${hasLocalStorage}]`;
  const modo = (storageBroken && !hasLocalStorage) ? ' (modo temporal: no se guardará entre sesiones aquí)' : '';
  if(all.length > 0){
    say(`Sistema en línea${modo}. Tengo ${all.length} recuerdos guardados. Di "lista todo" para verlos.${diag}`);
  } else {
    say(`Sistema en línea${modo}. Dime "recuerda que..." para empezar a guardar información.${diag}`);
  }
})();
</script>
</body>
</html>
